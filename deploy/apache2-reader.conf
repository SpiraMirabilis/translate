# Apache2 reverse proxy for T9 public reader
#
# Only exposes the library/reader frontend and the public API.
# All other paths are blocked (admin UI, authenticated API, WebSocket).
#
# Prerequisites:
#   sudo a2enmod proxy proxy_http ssl rewrite headers cache cache_disk remoteip
#
# Real-client-IP resolution lives GLOBALLY in /etc/apache2/conf-enabled/
# remoteip.conf (deployed 2026-07-10):
#   RemoteIPHeader CF-Connecting-IP
#   RemoteIPTrustedProxy <each published Cloudflare v4/v6 range>
# mod_remoteip rewrites REMOTE_ADDR from CF-Connecting-IP only when the TCP
# peer is in those ranges; a direct-to-origin connection keeps the attacker's
# own address. Refresh the ranges occasionally from
# https://www.cloudflare.com/ips-v4 + /ips-v6 (they change rarely).
#   sudo a2ensite reader.conf
#   sudo systemctl reload apache2
#
# SSL: Use certbot to provision a certificate:
#   sudo certbot --apache -d reader.example.com
#
# Cache: Apache will honour the Cache-Control headers from the backend.
#   Cache is stored on disk at /var/cache/apache2/mod_cache_disk/

<VirtualHost *:80>
    ServerName reader.example.com
    RewriteEngine On
    RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [R=301,L]
</VirtualHost>

<VirtualHost *:443>
    ServerName reader.example.com

    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/reader.example.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/reader.example.com/privkey.pem

    # ------------------------------------------------------------------
    # Caching — honour backend Cache-Control headers
    # ------------------------------------------------------------------
    CacheEnable disk /api/public
    CacheEnable disk /assets
    CacheDefaultExpire 300
    CacheDetailHeader on
    CacheHeader on

    # ------------------------------------------------------------------
    # Root redirect — send / to /library
    # ------------------------------------------------------------------
    RewriteEngine On
    RewriteRule ^/?$ /library [R=301,L]

    # ------------------------------------------------------------------
    # Proxy — only public paths are exposed
    # ------------------------------------------------------------------
    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"

    # ------------------------------------------------------------------
    # Real client IP — mod_remoteip (global conf, see header) has already
    # resolved REMOTE_ADDR from CF-Connecting-IP for trusted Cloudflare
    # peers. Strip the inbound header (redundant for CF traffic, forged
    # for direct connections) and rebuild X-Forwarded-For from the
    # resolved REMOTE_ADDR, so the backend never sees a client-controlled
    # IP header.
    # ------------------------------------------------------------------
    RequestHeader unset CF-Connecting-IP
    RequestHeader set X-Forwarded-For "%{REMOTE_ADDR}s"

    # Public API (JSON + cover images)
    ProxyPass        /api/public http://127.0.0.1:8000/api/public
    ProxyPassReverse /api/public http://127.0.0.1:8000/api/public

    # ------------------------------------------------------------------
    # Static error page assets — served directly from disk (NOT proxied).
    # The 503 page must work even when the backend is unreachable.
    # Files are written to dist/ by the SPA build step
    # (web/frontend/public/{404,503}.{html,png} → dist/).
    # Alias must come before ProxyPass to take precedence.
    # ------------------------------------------------------------------
    Alias /404.html /home/mdm/t9/web/frontend/dist/404.html
    Alias /404.png  /home/mdm/t9/web/frontend/dist/404.png
    Alias /503.html /home/mdm/t9/web/frontend/dist/503.html
    Alias /503.png  /home/mdm/t9/web/frontend/dist/503.png
    <Directory /home/mdm/t9/web/frontend/dist>
        Require all granted
    </Directory>

    # Frontend static assets (JS, CSS, fonts)
    ProxyPass        /assets http://127.0.0.1:8000/assets
    ProxyPassReverse /assets http://127.0.0.1:8000/assets

    # Favicon and other static files at root
    ProxyPass        /favicon.ico http://127.0.0.1:8000/favicon.ico
    ProxyPassReverse /favicon.ico http://127.0.0.1:8000/favicon.ico

    # Library and reader SPA routes — all served as index.html by the backend
    ProxyPass        /library http://127.0.0.1:8000/library
    ProxyPassReverse /library http://127.0.0.1:8000/library
    ProxyPass        /read http://127.0.0.1:8000/read
    ProxyPassReverse /read http://127.0.0.1:8000/read

    # ------------------------------------------------------------------
    # Custom error pages — themed static HTML served from the SPA build.
    # 503 is shown when Apache cannot reach the backend (service down,
    # restart, watchdog recovery); the page refreshes itself every 15s.
    # ------------------------------------------------------------------
    ErrorDocument 404 /404.html
    ErrorDocument 503 /503.html

    # ------------------------------------------------------------------
    # Block everything else — admin UI, authenticated API, WebSocket
    # Only allow: /library, /read, /api/public, /assets, /favicon.ico,
    # /404.html, /404.png, /503.html, /503.png
    #
    # Use RedirectMatch (mod_alias) instead of "Require all denied"
    # (mod_authz_core) so denials don't emit AH01630 "denied by server
    # configuration" lines to the error log — those were being picked
    # up by fail2ban's apache-auth filter and banning legitimate reader
    # sessions (iOS Safari auto-probing /apple-touch-icon*.png plus the
    # SPA polling /api/auth/status was enough to trip maxretry=5).
    # ------------------------------------------------------------------
    RedirectMatch 404 "^/apple-touch-icon.*\.png$"
    RedirectMatch 403 "^/api/(?!public/)"
    RedirectMatch 403 "^/ws(?:/|$)"
    RedirectMatch 404 "^/(?!library|read|api/|assets|favicon|404\.html|404\.png|503\.html|503\.png)"
</VirtualHost>
