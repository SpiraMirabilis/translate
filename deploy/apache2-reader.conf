# Apache2 reverse proxy for T9 public reader
#
# Proxies wholesale to the public-only backend process
# (deploy/t9-public.service → uvicorn web.public_app:app on 127.0.0.1:8001).
# That process contains ONLY public routes (/api/public/*, /api/health,
# /simple, the Library/Reader SPA and static assets) — there is no admin
# API, auth, or WebSocket in it, so no path whitelist is needed here.
# The admin app stays on 127.0.0.1:8000 behind its own vhost (t9.conf).
#
# Prerequisites:
#   sudo a2enmod proxy proxy_http ssl rewrite headers cache cache_disk
#   sudo a2ensite reader.conf
#   sudo systemctl reload apache2
#
# Real-client-IP resolution lives GLOBALLY in /etc/apache2/conf-enabled/
# remoteip.conf (deployed 2026-07-10):
#   RemoteIPHeader CF-Connecting-IP
#   RemoteIPTrustedProxy <each published Cloudflare v4/v6 range>
# mod_remoteip rewrites REMOTE_ADDR from CF-Connecting-IP only when the TCP
# peer is in those ranges; a direct-to-origin connection keeps the attacker's
# own address. Refresh the ranges occasionally from
# https://www.cloudflare.com/ips-v4 + /ips-v6 (they change rarely).
#
# SSL: Use certbot to provision a certificate:
#   sudo certbot --apache -d reader.boondollars.com
#
# Cache: Apache will honour the Cache-Control headers from the backend.
#   Cache is stored on disk at /var/cache/apache2/mod_cache_disk/

<VirtualHost *:80>
    ServerName reader.boondollars.com
    RewriteEngine On
    RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [R=301,L]
</VirtualHost>

<VirtualHost *:443>
    ServerName reader.boondollars.com

    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/reader.boondollars.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/reader.boondollars.com/privkey.pem

    # ------------------------------------------------------------------
    # Caching — honour backend Cache-Control headers
    # ------------------------------------------------------------------
    CacheEnable disk /api/public
    CacheDefaultExpire 300
    CacheDetailHeader on
    CacheHeader on

    # ------------------------------------------------------------------
    # NO root redirect. "/" is proxied like any other path and the backend
    # serves the Library page itself (with <link rel="canonical"> naming
    # /library). Redirecting the site's most-linked URL costs a round trip
    # and is the weaker signal for crawlers, so don't reinstate it.
    # ------------------------------------------------------------------

    # ------------------------------------------------------------------
    # Static error page assets — served directly from disk (NOT proxied).
    # The 502/503 pages must work even when the backend is unreachable.
    # Files are written to dist/ by the SPA build step
    # (web/frontend/public/{404,503}.{html,png} → dist/).
    # The matching "ProxyPass ... !" exclusions below keep these paths out
    # of the wholesale proxy so the Aliases take effect.
    # ------------------------------------------------------------------
    Alias /404.html /home/mdm/t9/web/frontend/dist/404.html
    Alias /404.png  /home/mdm/t9/web/frontend/dist/404.png
    Alias /503.html /home/mdm/t9/web/frontend/dist/503.html
    Alias /502.html /home/mdm/t9/web/frontend/dist/503.html
    Alias /503.png  /home/mdm/t9/web/frontend/dist/503.png
    Alias /502.png  /home/mdm/t9/web/frontend/dist/503.png
    <Directory /home/mdm/t9/web/frontend/dist>
        Require all granted
    </Directory>

    # ------------------------------------------------------------------
    # Proxy — everything to the public-only backend
    # ------------------------------------------------------------------
    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"
    # Strip the client-supplied CF header: mod_remoteip already consumed it
    # (trusted CF peers only) to resolve REMOTE_ADDR, so what remains is
    # either redundant or forged - the backend must only ever see the
    # X-Forwarded-For we set from the resolved REMOTE_ADDR below.
    RequestHeader unset CF-Connecting-IP
    RequestHeader set X-Forwarded-For "%{REMOTE_ADDR}s"

    # Exclusions (must precede ProxyPass /) — error pages served from disk
    ProxyPass /404.html !
    ProxyPass /404.png  !
    ProxyPass /503.html !
    ProxyPass /503.png  !
    ProxyPass /502.html !
    ProxyPass /502.png  !

    ProxyPass        / http://127.0.0.1:8001/
    ProxyPassReverse / http://127.0.0.1:8001/

    # Logs
    ErrorLog ${APACHE_LOG_DIR}/reader.boondollars.com-error.log
    CustomLog ${APACHE_LOG_DIR}/reader.boondollars.com-access.log combined

    # ------------------------------------------------------------------
    # Custom error pages — themed static HTML served from the SPA build.
    # 404: mirror of web/frontend/src/pages/NotFound.jsx (the backend
    #      serves the same file itself for unknown paths).
    # 502/503: shown when Apache cannot reach the backend (service down,
    #      restart, watchdog recovery). Refreshes itself every 15s.
    # ------------------------------------------------------------------
    ErrorDocument 404 /404.html
    ErrorDocument 503 /503.html
    ErrorDocument 502 /502.html
</VirtualHost>
