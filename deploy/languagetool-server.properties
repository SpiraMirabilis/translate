# LanguageTool HTTP server config for T9 (copy to ~/languagetool/server.properties)
# NOTE: systemd %h does not expand in this file — absolute paths required.
languageModel=/home/mdm/languagetool/ngrams
# Whole-chapter checks: chapters are typically 10-40k chars; 150k gives generous
# headroom while still bounding worst-case CPU/heap per request. The t9 proxy
# pre-rejects at the same limit so users get a friendly 413 instead of an LT error.
maxTextLength=150000
# Long texts + ngram confusion rules can exceed the default check budget.
maxCheckTimeMillis=60000
# Result cache (entries) — cheap RAM, big win for repeated checks while editing.
cacheSize=1000
pipelineCaching=true
