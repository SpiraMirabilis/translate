# T9 — `docker compose up -d`, then open http://localhost:8000. See QUICKSTART-Docker.md.
#
# All state (SQLite database, settings.json, .env secrets, covers, EPUBs, logs)
# lives in ./data on the host.

services:
  t9:
    # `docker compose pull` fetches the published release; `up --build`
    # builds this checkout instead. T9_VERSION pins a release (e.g. 1.2.0).
    image: ghcr.io/spiramirabilis/translate:${T9_VERSION:-latest}
    build: .
    restart: unless-stopped
    ports:
      # Loopback only. To expose it, set T9_PASSWORD in data/.env first, then
      # put a TLS reverse proxy in front (deploy/nginx-reverse-proxy.conf) or
      # change this to "8000:8000".
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data:/data
      # Codex provider login. Set CODEX_HOME_HOST=~/.codex in the .env next to
      # this file to reuse the host's existing Codex login; by default it
      # lives in data/codex. See QUICKSTART-Docker.md.
      - ${CODEX_HOME_HOST:-./data/codex}:/data/codex
    environment:
      # Run as this uid/gid instead of data/'s owner (PUID/PGID in the .env
      # next to this file; see QUICKSTART-Docker.md).
      PUID: ${PUID:-}
      PGID: ${PGID:-}
      # A reverse proxy on the host reaches the container from the network
      # gateway; trust forwarded client IPs from it (rate limits, comment bans).
      TRUSTED_PROXY_IPS: 127.0.0.1,172.30.57.1
      T9_FORWARDED_ALLOW_IPS: 127.0.0.1,172.30.57.1
    networks: [t9]

  # Always-on read-only MCP service; research use remains opt-in in T9 settings.
  # Share only T9's network namespace and bind
  # MCP to loopback: no published port and no access from the public reader or
  # other containers. The provider's default http://127.0.0.1:8766/mcp works.
  t9-research:
    image: ghcr.io/spiramirabilis/translate:${T9_VERSION:-latest}
    command: ["python", "-m", "mcp_server", "--read-only", "--transport", "streamable-http", "--host", "127.0.0.1", "--port", "8766"]
    restart: unless-stopped
    network_mode: "service:t9"
    depends_on:
      t9:
        condition: service_healthy
        restart: true
    volumes:
      - ./data:/data
    environment:
      PUID: ${PUID:-}
      PGID: ${PGID:-}
      MCP_USAGE_LOG: /data/logs/mcp_usage.log
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "python", "-c", "import json,urllib.request; h=json.load(urllib.request.urlopen('http://127.0.0.1:8766/health', timeout=8)); assert h['ok'] and h['read_only'] and h['research_scope_version']==1"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3

  # Optional: the public reader as its own process, as on the production host.
  # Start with `docker compose --profile public up -d`; it serves on :8001.
  t9-public:
    image: ghcr.io/spiramirabilis/translate:${T9_VERSION:-latest}
    command: ["public"]
    profiles: [public]
    restart: unless-stopped
    depends_on: [t9]
    ports:
      - "127.0.0.1:8001:8000"
    volumes:
      - ./data:/data
      - ${CODEX_HOME_HOST:-./data/codex}:/data/codex
    environment:
      PUID: ${PUID:-}
      PGID: ${PGID:-}
      TRUSTED_PROXY_IPS: 127.0.0.1,172.30.57.1
      T9_FORWARDED_ALLOW_IPS: 127.0.0.1,172.30.57.1
    networks: [t9]

  # Optional: automated source scraping. `docker compose --profile scraper up -d`
  # starts the chapter scraper (a headed Chrome; solve its challenges over
  # noVNC at http://localhost:6080/vnc.html) and the worker that feeds it.
  # With a scraper on another machine, use `--profile scrape-worker` for the
  # worker alone. See QUICKSTART-Docker.md.
  t9-scraper-worker:
    image: ghcr.io/spiramirabilis/translate:${T9_VERSION:-latest}
    command: ["python", "scrape_worker.py"]
    profiles: [scraper, scrape-worker]
    restart: unless-stopped
    # T9's network namespace: the admin API at 127.0.0.1:8000 (auto-starts)
    # and the scraper at http://scraper:8787.
    network_mode: "service:t9"
    depends_on:
      t9:
        condition: service_healthy
        restart: true
    volumes:
      - ./data:/data
    environment:
      PUID: ${PUID:-}
      PGID: ${PGID:-}

  scraper:
    image: ghcr.io/spiramirabilis/t9-scraper:${SCRAPER_VERSION:-latest}
    profiles: [scraper]
    restart: unless-stopped
    # Starts after T9, whose entrypoint creates data/scraper owned by you.
    depends_on:
      t9:
        condition: service_healthy
    # Reaps the browser's exited child processes.
    init: true
    # Chrome needs more shared memory than Docker's 64 MB default.
    shm_size: 1gb
    # Fixed, so the browser profile isn't seen as locked by another machine
    # after the container is recreated.
    hostname: scraper
    # Chrome's sandbox needs user namespaces, which Docker's default seccomp
    # profile blocks; Chrome then confines each page with its own, stricter
    # seccomp filter.
    security_opt:
      - seccomp=unconfined
      - no-new-privileges:true
    ports:
      - "127.0.0.1:6080:6080"   # noVNC
      - "127.0.0.1:8787:8787"   # API and /docs
    volumes:
      # Job database, browser profiles, and .env (its API_TOKEN is T9's SCRAPER_TOKEN).
      - ./data/scraper:/data
    environment:
      PUID: ${PUID:-}
      PGID: ${PGID:-}
    networks: [t9]

networks:
  t9:
    ipam:
      # Fixed so the gateway address above is known. Change all three if this
      # subnet collides with one on your machine.
      config:
        - subnet: 172.30.57.0/24
          gateway: 172.30.57.1
