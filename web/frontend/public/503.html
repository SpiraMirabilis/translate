<!doctype html>
<!--
  Static 503 page used by the Apache public-reader vhost
  (ErrorDocument 503 in /etc/apache2/sites-available/reader.conf).
  Rendered when Apache cannot reach the backend — e.g. during a
  service restart or while the watchdog is bringing the app back up.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cultivating — please wait</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta http-equiv="refresh" content="15" />
    <style>
      html, body { margin: 0; padding: 0; height: 100%; }
      body {
        background: #0f172a;
        color: #cbd5e1;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1rem;
        box-sizing: border-box;
      }
      .card {
        width: 100%;
        max-width: 42rem;
        background: #1e293b;
        border: 1px solid #334155;
        border-radius: 0.75rem;
        overflow: hidden;
        box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
      }
      .card img { display: block; width: 100%; height: auto; }
      .body { padding: 1.5rem; text-align: center; }
      @media (min-width: 640px) { .body { padding: 2rem; } }
      .tagline { margin: 0 0 0.5rem; color: #cbd5e1; }
      .subtle { margin: 0 0 1.5rem; color: #94a3b8; font-size: 0.875rem; }
      .button {
        display: inline-block;
        padding: 0.5rem 1rem;
        background: #4f46e5;
        color: #ffffff;
        border-radius: 0.5rem;
        font-size: 0.875rem;
        font-weight: 500;
        text-decoration: none;
        transition: background-color 150ms;
      }
      .button:hover { background: #6366f1; }
    </style>
  </head>
  <body>
    <div class="card">
      <img src="/503.png" alt="A young cultivator sits in lotus pose, meditating patiently amid swirling violet spiritual energy." />
      <div class="body">
        <p class="tagline">The library tender is mid-cultivation. Please sit patiently and try again in a moment.</p>
        <p class="subtle">This page will retry automatically every 15 seconds.</p>
        <a class="button" href="/library">Try again</a>
      </div>
    </div>
  </body>
</html>
